services:

  # ── Streamlit 앱 ─────────────────────────────────────────────────
  dogbreeder-app:
    build: .
    container_name: dogbreeder-app
    ports:
      - "${APP_PORT:-8502}:${APP_PORT:-8502}"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - APP_PORT=${APP_PORT:-8502}
      - BASE_PATH=${BASE_PATH:-dogbreeder}
      - HF_HOME=/app/models
      - TRANSFORMERS_CACHE=/app/models/hub
      - SENTENCE_TRANSFORMERS_HOME=/app/models/hub
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    restart: unless-stopped
