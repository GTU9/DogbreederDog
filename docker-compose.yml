services:
  dogbreeder:
    build: .
    container_name: dogbreeder-app
    ports:
      - "8502:8502"
    environment:
      # OpenAI API 키 (.env 파일에서 로드)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # HuggingFace 모델 캐시 경로를 볼륨 마운트 위치로 지정
      - HF_HOME=/app/models
      - TRANSFORMERS_CACHE=/app/models/hub
      - SENTENCE_TRANSFORMERS_HOME=/app/models/hub
    volumes:
      # 모델 캐시 - 컨테이너 재시작해도 재다운로드 없음
      - ./models:/app/models
      # FAISS DB - 외부에서 관리 가능
      - ./data:/app/data
    restart: unless-stopped
